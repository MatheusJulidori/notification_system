global:
  scrape_interval: 15s 
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    scrape_interval: 5s
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'unified-notifications-api'
    scrape_interval: 5s
    metrics_path: '/api/v1/metrics' 
    static_configs:
      - targets: ['api:4000']